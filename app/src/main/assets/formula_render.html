<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<!--
  To Top 公式渲染宿主页（完全离线，禁止 MathJax，禁止任何 CDN）。

  渲染器选择顺序（脚本内自动判定，无需 Kotlin 关心）：
  1. 优先 assets/katex/katex.min.js + katex.min.css（正式方案）；
  2. 缺失时退回 assets/katex/totop-latex.min.js（自研轻量兜底，见该文件头部说明）；
  3. 两者都不可用时回调 onFailed，由 Kotlin 侧把公式降级为纯文本。

  接口约定（与 FormulaRenderer 严格对齐）：
  - ToTop.render(id, latex, displayMode, maxWidthPx)
  - 成功：window.ToTopBridge.onRendered(id, widthPx, heightPx)
  - 失败：window.ToTopBridge.onFailed(id, message)

  像素单位约定（曾导致「公式只显示出一个头」的根因）：
  - Kotlin 侧 maxWidthPx / 回调的 widthPx、heightPx 一律是**物理像素**；
  - 本页面的 CSS px 是**逻辑像素**，1 CSS px = devicePixelRatio 物理像素。
  把 CSS px 直接当物理像素用，在 density 2.75 的手机上位图只有实际内容的
  1/2.75，截图就只剩公式左上角那一小块。因此这里两个方向都做换算：
    slot 宽度（CSS）= maxWidthPx / dpr
    回调尺寸（物理）= getBoundingClientRect() × dpr
  换算后 WebView 被 measure 成 maxWidthPx 物理宽时，CSS 视口宽度恰好等于
  slot 宽度，不会二次重排，截取的区域也就是完整内容。
-->
<link rel="stylesheet" href="katex/katex.min.css" />
<link rel="stylesheet" href="katex/totop-latex.min.css" />
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-size: 16px;
        font-family: sans-serif;
        -webkit-text-size-adjust: 100%;
        overflow: hidden;
    }
    #slot {
        box-sizing: border-box;
        padding: 2px 4px 4px 4px;
        color: #1B1C1A;
        line-height: 1.5;
        word-break: break-word;
    }
    /* 行间公式的上下留白必须走 padding：margin 不计入 getBoundingClientRect().height，
       会让 WebView 顶部先空出一条，底部反过来被裁掉几个像素。 */
    #slot.display {
        text-align: center;
        padding-top: 4px;
        padding-bottom: 6px;
    }
    .katex-error {
        color: #9B2C2C;
    }
</style>
</head>
<body>
<div id="slot"></div>
<!-- 正式 KaTeX 资源：若未下载会被浏览器跳过（不抛异常） -->
<script src="katex/katex.min.js"></script>
<!-- 自研兜底渲染器：KaTeX 不可用时接管 -->
<script src="katex/totop-latex.min.js"></script>
<script>
    (function () {
        "use strict";

        var slot = document.getElementById("slot");
        var bridge = window.ToTopBridge || null;
        var hasKatex = typeof katex !== "undefined" && katex !== null && typeof katex.render === "function";
        var hasFallback = typeof window.ToTopLatexFallback !== "undefined";

        /** CSS px -> 物理 px 的倍率；取不到就按 1 处理，至少不会比原来更糟。 */
        function pixelRatio() {
            var ratio = window.devicePixelRatio;
            return (typeof ratio === "number" && ratio > 0) ? ratio : 1;
        }

        function reportOk(id) {
            if (!bridge) {
                return;
            }
            try {
                var rect = slot.getBoundingClientRect();
                var ratio = pixelRatio();
                bridge.onRendered(
                    String(id),
                    Math.ceil(rect.width * ratio) || 1,
                    Math.ceil(rect.height * ratio) || 1
                );
            } catch (e) {
                // 桥接异常不得抛回页面，否则后续渲染会被阻断
            }
        }

        function reportFailed(id, message) {
            if (!bridge) {
                return;
            }
            try {
                bridge.onFailed(String(id), String(message || "公式渲染失败"));
            } catch (e) {
                // 同上
            }
        }

        var ToTop = {
            /**
             * 渲染一条公式。
             * @param {number} id       请求序号
             * @param {string} latex    LaTeX 源码（不含定界符）
             * @param {boolean} display 是否行间公式
             * @param {number} maxWidth 排版宽度（物理像素），与 Kotlin 截图宽度一致
             */
            render: function (id, latex, display, maxWidth) {
                var width = maxWidth > 0 ? maxWidth : 720;
                // maxWidth 是物理像素：换回 CSS 宽度，否则在高 density 设备上公式会
                // 被排成「物理宽度那么宽」的逻辑宽度，截图却按物理像素裁剪。
                slot.className = display ? "display" : "";
                slot.style.width = (width / pixelRatio()) + "px";
                slot.textContent = "";

                if (hasKatex) {
                    try {
                        katex.render(String(latex), slot, {
                            displayMode: !!display,
                            throwOnError: true,
                            strict: "ignore",
                            trust: false,
                            output: "html"
                        });
                        setTimeout(function () {
                            reportOk(id);
                        }, 0);
                        return;
                    } catch (error) {
                        // KaTeX 语法不支持时，先尝试兜底渲染器，仍失败才降级
                        slot.textContent = "";
                        if (!hasFallback) {
                            reportFailed(id, (error && error.message) ? error.message : "KaTeX render failed");
                            return;
                        }
                    }
                }

                if (hasFallback) {
                    try {
                        window.ToTopLatexFallback.render(String(latex), slot);
                        setTimeout(function () {
                            reportOk(id);
                        }, 0);
                        return;
                    } catch (error2) {
                        slot.textContent = String(latex);
                        slot.className = slot.className + " katex-error";
                        reportFailed(id, (error2 && error2.message) ? error2.message : "fallback render failed");
                        return;
                    }
                }

                slot.textContent = String(latex);
                slot.className = slot.className + " katex-error";
                reportFailed(id, "KaTeX 资源缺失，且兼底渲染器不可用");
            }
        };

        window.ToTop = ToTop;
    })();
</script>
</body>
</html>
