name: Release

on:
  push:
    tags:
      - "v*"
  # 允许手动触发，用于演练发布流程而不真正创建 tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # git 在 Windows 上不记录文件的可执行位（core.fileMode=false），
      # 仓库中的 gradlew 因此以 100644 入库，Linux runner 直接执行会得到
      # exit code 126（Permission denied）。此处显式补权限，避免再依赖本地 git 配置。
      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 写入签名配置
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # 未配置 Secret 时 secrets 上下文解析为空字符串，base64 -d 会产出 0 字节文件，
          # 之后的 packageRelease 只会抛 "Tag number over 30 is not supported"，
          # 完全看不出真实原因。这里先做空值检查，把诊断信息说清楚。
          # 注意：不用 "cond && assign" 的简写，GitHub Actions 以 bash -e 运行，
          # 条件为假时整条命令返回非零会让脚本在此处直接退出。
          missing=""
          for name in RELEASE_STORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::以下 Secrets 未配置或为空：$missing"
            echo "请在仓库 Settings - Secrets and variables - Actions 中补齐后再重跑。"
            exit 1
          fi
          # 签名材料只存在于 Secrets，落盘后立即在后续步骤中删除
          echo "$RELEASE_STORE_BASE64" | base64 -d > release.jks
          if [ ! -s release.jks ]; then
            echo "::error::RELEASE_STORE_BASE64 解码后为空文件，请确认它是 keystore 的 base64 编码"
            exit 1
          fi
          # 提前校验密钥库可读，避免等到 R8 打包数分钟后才在 packageRelease 暴露
          if ! keytool -list -keystore release.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::无法用给定密码与别名读取 release.jks，请核对 RELEASE_STORE_PASSWORD 与 RELEASE_KEY_ALIAS"
            exit 1
          fi
          {
            echo "RELEASE_STORE_FILE=release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> local.properties

      - name: 质量门禁（规范、静态分析、单元测试）
        run: |
          ./gradlew :app:ktlintCheck --console=plain
          ./gradlew :app:detekt --console=plain
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: R8 构建 Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 校验产物与体积门禁（arm64 不超过 30MB）
        run: |
          set -e
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "未找到已签名的 release APK，请检查 Secrets 中的签名配置"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          size=$(stat -c%s "$apk")
          mb=$((size / 1024 / 1024))
          echo "APK 体积: ${mb} MB（${size} 字节）"
          if [ "$size" -gt 31457280 ]; then
            echo "APK 体积超出 30MB 门禁，请检查资源与依赖"
            exit 1
          fi

      - name: 清理签名材料
        if: always()
        run: |
          rm -f release.jks
          # 防止签名信息残留在构建缓存与工作区
          find . -name "*.jks" -delete || true

      # workflow_dispatch 没有 tag 上下文，action-gh-release 此时拿不到 GITHUB_REF 里的 tag，
      # 必然失败。加条件后，手动触发的语义才与文件开头的注释一致：
      # 完整演练构建、签名与体积门禁，但不创建 Release。
      - name: 创建 Release 并上传 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
