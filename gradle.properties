# JVM 参数：低端机开发环境亦需保证 KSP 与 R8 正常运行
org.gradle.jvmargs=-Xmx4096m -Xss8m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：本项目配置阶段实测占 14 秒（:app 9.5s、根 4.5s），任务执行仅 0.2 秒，
# 开与不开差一个数量级。AGP 8.5.2 + Gradle 8.7 + KSP/Hilt/ktlint/detekt 实测可存取，
# 无兼容性警告。改 gradle.properties、build.gradle.kts 或版本目录时条目会失效一次，属正常。
org.gradle.configuration-cache=true
# 配置缓存出问题时降级为警告而不是直接中断构建：项目里 8 个第三方插件的兼容性
# 不在我们控制范围内，宁可慢一点也不能让构建打不开。
org.gradle.configuration-cache-problems=warn

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# 部分受限/沙箱环境下 Kotlin 编译守护进程无法建立本地连接，
# 统一使用进程内编译，保证任何开发者与 CI 环境都能构建成功。
kotlin.compiler.execution.strategy=in-process
ksp.incremental=false

